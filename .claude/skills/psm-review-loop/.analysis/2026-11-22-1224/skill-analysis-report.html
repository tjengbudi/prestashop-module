<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Analysis Report</title>
<style>
  :root {
    --bg: #0f1b2d;
    --panel: #16263d;
    --panel-2: #1d3250;
    --ink: #e9eef6;
    --ink-dim: #9fb0c7;
    --line: #294366;
    --accent: #b66d46;
    --accent-ink: #f4d9c8;
    --critical: #e05656;
    --high: #e0904a;
    --medium: #d8c24a;
    --low: #5aa0d0;
    --ok: #4caf72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header .meta { color: var(--ink-dim); font-size: 13px; }
  header .meta b { color: var(--ink); font-weight: 600; }

  .banner {
    display: none;
    background: #3a1414;
    border: 1px solid var(--critical);
    color: #ffd9d9;
    padding: 14px 16px;
    border-radius: 8px;
    margin: 16px 0;
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }
  .banner.show { display: block; }

  .overview {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin: 18px 0;
  }
  .grade {
    font-size: 34px;
    font-weight: 800;
    margin: 0 0 8px;
    text-transform: capitalize;
  }
  .grade.g-excellent { color: var(--ok); }
  .grade.g-good { color: var(--low); }
  .grade.g-fair { color: var(--medium); }
  .grade.g-poor { color: var(--critical); }
  .verdict { font-size: 16px; font-weight: 600; margin: 0 0 14px; }
  .summary { color: var(--ink-dim); margin: 0 0 14px; }
  .counts { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    font-size: 13px;
  }
  .pill .dot { width: 10px; height: 10px; border-radius: 50%; }
  .pill .n { font-weight: 700; }
  .dot.critical { background: var(--critical); }
  .dot.high { background: var(--high); }
  .dot.medium { background: var(--medium); }
  .dot.low { background: var(--low); }

  /* Generic synthesis/agent-block panel */
  .block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin: 18px 0;
  }
  .block > h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin: 0 0 12px;
  }
  .block .mono, .block code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: var(--panel-2);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .kv { margin: 0; display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; }
  .kv dt { color: var(--ink-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kv dd { margin: 0; }

  /* Themes */
  .theme { padding: 12px 0; border-top: 1px solid var(--line); }
  .theme:first-of-type { border-top: none; padding-top: 0; }
  .theme .t-head { display: flex; align-items: center; gap: 10px; }
  .theme .t-title { font-weight: 600; flex: 1 1 auto; min-width: 0; }
  .theme .t-cause { color: var(--ink-dim); margin-top: 4px; }
  .theme .t-action { margin-top: 4px; }
  .theme .t-findings { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--line); }
  .theme .t-finding { font-size: 13px; color: var(--ink-dim); padding: 2px 0; }

  /* Strengths */
  .strength-list { margin: 0; padding-left: 20px; }
  .strength-list li { padding: 2px 0; }

  /* Recommendations */
  .rec { padding: 8px 0; border-top: 1px solid var(--line); }
  .rec:first-of-type { border-top: none; padding-top: 0; }
  .rec .rank { font-weight: 700; color: var(--accent-ink); margin-right: 8px; }
  .rec .resolves { color: var(--ink-dim); font-size: 12px; margin-left: 8px; }

  /* Experience journeys */
  .block .journey { padding: 8px 0; border-top: 1px solid var(--line); }
  .block .journey:first-of-type { border-top: none; padding-top: 0; }
  .block .journey .j-name { font-weight: 600; }
  .block .journey .j-steps { color: var(--ink-dim); margin-top: 2px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 10px;
    flex-wrap: wrap;
  }
  .toolbar .sel-count { color: var(--ink-dim); font-size: 13px; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    padding: 8px 14px;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a0e07;
    font-weight: 600;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.link {
    background: none;
    border: none;
    color: var(--accent-ink);
    padding: 4px 6px;
    font-size: 13px;
  }
  button.small { padding: 5px 10px; font-size: 13px; flex: 0 0 auto; }

  .no-findings {
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 28px;
    text-align: center;
    color: var(--ink-dim);
  }
  .no-findings .big { font-size: 18px; color: var(--ok); margin-bottom: 6px; }

  .group { margin: 18px 0; }
  .group > h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .finding {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--line);
    border-radius: 8px;
    margin: 8px 0;
    overflow: hidden;
  }
  .finding.sev-critical { border-left-color: var(--critical); }
  .finding.sev-high { border-left-color: var(--high); }
  .finding.sev-medium { border-left-color: var(--medium); }
  .finding.sev-low { border-left-color: var(--low); }

  .finding .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
  }
  .finding .row .chk { width: 16px; height: 16px; flex: 0 0 auto; cursor: pointer; }
  .finding .row .head { flex: 1 1 auto; cursor: pointer; min-width: 0; }
  .finding .row .title { font-weight: 600; }
  .finding .row .sub { color: var(--ink-dim); font-size: 12px; margin-top: 2px; }
  .finding .tag {
    flex: 0 0 auto;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink-dim);
  }
  .finding .caret { flex: 0 0 auto; color: var(--ink-dim); transition: transform 0.15s; cursor: pointer; }
  .finding.open .caret { transform: rotate(90deg); }

  .finding .body {
    display: none;
    padding: 0 14px 14px 42px;
    border-top: 1px solid var(--line);
  }
  .finding.open .body { display: block; }
  .finding .body dl { margin: 12px 0 0; display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px; }
  .finding .body dt { color: var(--ink-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .finding .body dd { margin: 0; }
  .finding .body code, .finding .body .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: var(--panel-2);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: var(--ok);
    color: #06160c;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .fallback-area { margin-top: 12px; display: none; }
  .fallback-area.show { display: block; }
  .fallback-area textarea {
    width: 100%;
    min-height: 160px;
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }
</style>
</head>

</div>

      "evidence": "Every lens must write `[{location, issue, implementation_impact, suggestion}]` to a file and return ONLY `{count, path}`. bmad-review-edge-case-hunter's SKILL.md says 'Return ONLY a valid JSON array' with different fields (trigger_condition, guard_snippet, potential_consequence). bmad-review-adversarial-general outputs 'a Markdown list' and has HALT conditions that 'ask for guidance', which no one can answer inside a subagent. The prompts never tell the subagent that the loop's file schema and return format override the invoked skill's output section. The subagent gets two competing ONLY instructions, and triage may receive files in mixed schemas.",
      "recommendation": "In the core-lens instructions, say explicitly: run the skill's analysis, then map its findings into the loop schema, which overrides the skill's output format. Also say how to handle a HALT (no user is present, so write `[]` and return count 0). Give the mapping for edge-case-hunter's fields.",
      "lens": "architecture"
    },
    {
      "id": "architecture-5",
      "severity": "medium",
      "title": "Round files are keyed by document basename, so different runs collide",
      "location": "SKILL.md:Review round (line 32)",
      "evidence": "Findings go to `{project-root}/_bmad-output/psm-review-loop/<doc-name>/round-N/<lens>.json`. The main caller, psm-plan, always produces `.psm-develop-plan.md`, so every module's plan shares the same folder. A later run, or a lens that fails to write, leaves stale files from an earlier run. The triage subagent 'reads the round's finding files' without telling which run they came from. Concurrent runs overwrite each other.",
      "recommendation": "Make each run's output unique, for example `<doc-name>-<timestamp>/round-N/` or a hash of the doc path. Have the parent give the triage subagent the exact list of paths that the reviewers returned this round, instead of a folder to scan.",
      "lens": "architecture"
    },
    {
      "id": "architecture-6",
      "severity": "low",
      "title": "The memlog append commands omit the target argument the script requires",
      "location": "SKILL.md:Triage & fix (line 54)",
      "evidence": "Line 54 writes `append --type event --text ...` with no script path and no `--path`. In _bmad/scripts/memlog.py, `append` requires one of `--workspace` or `--path`. Only activation step 4, which the triage subagent may not see, shows the full `memlog.py init --path <doc-dir>/.memlog.md` form.",
      "recommendation": "Write the full command wherever it is used: `uv run {project-root}/_bmad/scripts/memlog.py append --path <doc-dir>/.memlog.md --type ... --text ...`. Do this especially in the carved triage reference, which must stand alone.",
      "lens": "architecture"
    },
    {
      "id": "determinism-1",
      "severity": "high",
      "title": "Triage subagent reads raw reviewer files and merges them every round, and nothing checks their shape",
      "location": "SKILL.md:Review round (lines 32, 38) and Triage & fix (line 44)",
      "evidence": "Each reviewer \"writes a JSON array [{\"location\",\"issue\",\"implementation_impact\",\"suggestion\"}] to .../round-N/<lens>.json and returns ONLY {\"count\": N, \"path\": \"...\"}\". Then the triage subagent \"reads the round's finding files\" and must \"Merge findings, drop duplicates\". In the real run that meant 46-66 raw findings across three files per round, merged and deduplicated by the model, for up to max_rounds=5 rounds. Nothing checks that each file parses, carries the four required keys, or matches the count the reviewer reported. A malformed or prose-wrapped file reaches triage unnoticed.",
      "recommendation": "Determinism leak. Apply the determinism test: concatenating JSON arrays, checking the four required keys, comparing the array length to the reported count, assigning stable IDs (<lens>-<k>), removing exact duplicates and grouping by normalized location all give the same output for the same input and can be unit-tested. The signal-verb scan hits 'merge', 'drop duplicates' and 'validate'. Add a script, for example scripts/merge-round.py <round-dir>, that does this work and emits one compact merged.json with per-lens counts, candidate duplicate clusters grouped by location, and a list of invalid files to re-run. This is the pre-pass JSON pattern. The triage subagent then reads merged.json instead of three raw files. Only semantic deduplication (different wording, same point) and checking each finding against the document stay in the prompt.",
      "lens": "determinism"
    },
    {
      "id": "determinism-2",
      "severity": "medium",
      "title": "Model does round numbering, round directory naming and round-cap counting",
      "location": "SKILL.md:Review round (line 32) and Stop (line 59); Headless mode (line 75, \"rounds\")",
      "evidence": "Output paths use \".../_bmad-output/psm-review-loop/<doc-name>/round-N/<lens>.json\". The Cap rule is \"{workflow.max_rounds} rounds done and high findings remain\", and the headless return reports \"rounds\": 0. N, the cap comparison and the final count all come from the model's own tracking (confirmed in the test run). Nothing covers a second run on the same document, where round-1..k directories from a previous run already exist. A model that restarts at 1 overwrites or mixes stale reviewer files, and a model that miscounts stops early or late.",
      "recommendation": "Determinism leak. By the determinism test, listing round-* directories, choosing the next N, creating the directory and comparing N to max_rounds each have one correct answer. Add a small script, for example scripts/round-state.py next --doc-name <name> --max-rounds <n>, that returns {\"round\": N, \"dir\": \"...\", \"cap_reached\": bool}. Give it a run-scoped prefix or archive step so a fresh run does not collide with old round directories. The prompt then consumes the returned N and the cap flag instead of counting.",
      "lens": "determinism"
    },
    {
      "id": "determinism-3",
      "severity": "medium",
      "title": "Rejected findings and fixes share one memlog type, so building the carry-forward list needs the model",
      "location": "SKILL.md:On Activation (line 26), Review round (line 30), Triage & fix (lines 50, 54), Stop (line 60)",
      "evidence": "Rejected findings are logged as \"--type decision\" (line 50), and \"each substantive fix\" is also \"--type decision\" (line 54). Every round, reviewers must receive only \"findings Budi rejected and binding decisions ... labeled 'already decided — do not raise again'\". Oscillation detection also needs the history of earlier rounds' fixes. Because both kinds share one tag and fixes carry no round number, the model has to reread the whole memlog and classify each entry to build these lists. memlog.py offers a free-form --type, so the conflation comes from this skill.",
      "recommendation": "Determinism leak caused by the logging schema. Log with distinct tags, for example --type rejected for ignored findings and --type fix with \"round N:\" in the text for applied fixes. Building the carry-forward list and the per-round fix history then becomes a filter that passes the determinism test (it can be unit-tested), and a short script or grep can emit it as compact JSON for the reviewers and the triage subagent. This is the pre-pass JSON pattern. Judging whether a new finding reverses or repeats an earlier fix stays in the triage prompt, because that is semantic.",
      "lens": "determinism"
    },
    {
      "id": "determinism-4",
      "severity": "low",
      "title": "Model composes the round event line and the running medium/low total",
      "location": "SKILL.md:Triage & fix (line 54) and Headless mode (line 75, \"remaining_medium_low\")",
      "evidence": "The parent builds \"review-loop round N: X critical/high fixed, Y asked, Z dropped (unproven), W medium/low\" by hand from the triage JSON counts, and must keep a cross-round total for remaining_medium_low.",
      "recommendation": "Small determinism leak. Formatting fixed fields into a template and summing counts across rounds fall to the signal verbs 'format' and 'count'. Fold this into the round-state script from determinism-2, for example a 'close --triage-json <file>' subcommand that appends the memlog event and returns running totals for the final report and the headless return.",
      "lens": "determinism"
    },
    {
      "id": "customization-1",
      "severity": "medium",
      "title": "Extra review_lenses entries have no defined output filename, so one lens can silently overwrite another's findings",
      "location": "SKILL.md:Review round (line 32)",
      "evidence": "Each lens writes to `{project-root}/_bmad-output/psm-review-loop/<doc-name>/round-N/<lens>.json`. The three core lenses have obvious names. A `{workflow.review_lenses}` entry can be a `skill:`, a `file:`, or a plain-text reviewer prompt, and nothing says what `<lens>` is for it. Two plain-text entries, or an entry whose derived name matches a core lens (e.g. a team adds an extra 'adversarial' prompt), would write to the same file. The triage subagent only reads the round's finding files. A clobbered file drops findings without any warning, and that can make the stop rule ('0 critical/high after triage') report clean too early.",
      "recommendation": "Define a deterministic name for extra lenses in SKILL.md, for example `extra-<index>.json` (1-based position in `{workflow.review_lenses}`), or `<skill-name>.json` for `skill:` entries and `extra-<index>.json` otherwise. Core lens files keep their fixed names. This keeps the override additive and its output visible to triage.",
      "lens": "customization"
    },
    {
      "id": "customization-2",
      "severity": "low",
      "title": "on_complete behavior in headless mode is unspecified",
      "location": "SKILL.md:Stop (line 62) vs Headless mode (lines 72-78)",
      "evidence": "`{workflow.on_complete}` runs after the interactive report to Budi. Headless mode says 'Return ONLY JSON' and never mentions on_complete. When another skill calls this one with no operator, it is unclear whether a team's on_complete hook (for example a handoff or notification) should run. If it runs and produces output, it breaks the JSON-only return contract.",
      "recommendation": "Add one clause to Headless mode, e.g. 'Run `{workflow.on_complete}` if non-empty before emitting the JSON; its output must not precede or replace the JSON return.' Or state explicitly that on_complete is skipped in headless mode.",
      "lens": "customization"
    },
    {
      "id": "enhancement-1",
      "severity": "high",
      "title": "Add: pass open escalations forward and stop early when only human decisions remain",
      "location": "SKILL.md:30, 38, 56-60, 72-78",
      "evidence": "Pattern: headless readiness / graceful degradation. Only 'findings Budi rejected and binding decisions' are passed to fresh reviewers. In headless mode, fixes that need Budi are 'not applied — log them as assumptions/escalations', so they never become rejected findings. The next round's fresh reviewers raise the same points again, triage sends them back to Budi, and the round can never be clean. The same thing happens interactively when Budi leaves an escalation unanswered. The loop then runs to the max_rounds cap (default 5, ~0.8-1M subagent tokens per round) only to return 'butuh intervensi', which it already knew after round 1.",
      "recommendation": "In Review round, add a sentence passing items awaiting a human decision (headless escalations and unanswered questions) forward under the same 'already decided — do not raise again' label, phrased as 'already escalated'. In Stop, add a condition: when every remaining critical/high after triage is waiting for a human decision, stop right away. Headless returns 'butuh intervensi'; interactive asks Budi now instead of starting another round.",
      "lens": "enhancement"
    },
    {
      "id": "enhancement-2",
      "severity": "medium",
      "title": "Add: a round counts as clean only if every lens finished, and keep round files per run",
      "location": "SKILL.md:32-38, 58",
      "evidence": "Pattern: graceful degradation in a hostile environment. Nothing covers a reviewer subagent that crashes, hits its context limit, or writes no or malformed JSON. A round with a missing lens file can look like 0 findings, triage finds 0 high, and the loop stops as 'Clean' and returns 'selesai', which a headless caller trusts. Round files go to `_bmad-output/psm-review-loop/<doc-name>/round-N/`, and that path is not unique per run. A later run on the same document, or a different document with the same file name, can leave stale lens files that triage then reads as this round's findings.",
      "recommendation": "Before handing off to triage, require each lens to have returned `{count, path}` with a file that exists and parses. Re-run a failed lens once; if it fails again, mark the round incomplete. An incomplete round can never satisfy Clean, and in headless mode it ends as 'butuh intervensi' with the reason. Add a run identifier to the output path, for example a timestamp under `<doc-name>/`.",
      "lens": "enhancement"
    },
    {
      "id": "enhancement-3",
      "severity": "medium",
      "title": "Add: stop when rounds stop making progress, before hitting the cap",
      "location": "SKILL.md:56-60",
      "evidence": "Pattern: testable progression/stop conditions. 'Ambiguity counts as high on purpose', and the adversarial reviewer must report at least ten issues. With fresh reviewers each round, there is usually another sentence with two readings, so new highs keep appearing. Oscillation only catches a fix being repeated or reversed, not a steady stream of new highs. In the two-round test, unique findings fell only from 39 to 32. As written, the expected path is often the 5-round cap at roughly 4-5M tokens, while the last rounds add little.",
      "recommendation": "Add one Stop bullet: if the verified critical/high count does not go down for two rounds in a row, stop and report the remaining items, the same way the cap does (headless: 'butuh intervensi'). This costs no assurance on documents that are converging, and the report still lists what is left.",
      "lens": "enhancement"
    },
    {
      "id": "enhancement-4",
      "severity": "medium",
      "title": "Remove: logging every medium/low as a memlog gap each round",
      "location": "SKILL.md:54, 62",
      "evidence": "Pattern: memlog over-applied. Each round logs 'each medium/low as `--type gap`'. Most medium/low findings are quota filler from the adversarial lens, and fresh reviewers raise them again every round, so a 5-round run can append well over a hundred near-duplicate gap entries. The memlog often belongs to the caller: for bmad-spec it 'is the authority on decisions', and finalize has to account for every entry. Those runs end up flooding the caller's memlog with noise. The final report still has to deduplicate the medium/low list across rounds.",
      "recommendation": "Keep medium/low findings only in the round JSON files. At Stop, append a single `--type gap` entry with the deduplicated medium/low list, or a pointer to it. Nothing is lost: the per-round detail stays on disk under `_bmad-output`, and the decision trail keeps only what downstream readers need.",
      "lens": "enhancement"
    },
    {
      "id": "enhancement-5",
      "severity": "medium",
      "title": "Add: report the blocking reason and remaining highs in the return, including when called interactively by a skill",
      "location": "SKILL.md:62, 72-78",
      "evidence": "Pattern: headless JSON return (principles: on 'blocked', include a one-line `reason`). 'butuh intervensi' covers three different situations: a decision is pending, the cap was hit, or oscillation occurred. The return carries only `remaining_medium_low`, with no count of remaining critical/high and no pending-escalation count. A calling skill (psm-plan, bmad-spec, bmad-prd, bmad-quick-dev) therefore cannot tell whether to proceed, ask the user, or re-run without parsing the memlog. When a skill invokes this one interactively, the run ends with a prose report to Budi instead of a result the caller can act on.",
      "recommendation": "Add `reason` (`awaiting_decision | cap | oscillation | lens_failure`), `remaining_critical_high`, and `escalations` to the JSON. Return the same JSON whenever the invoker is a skill, interactive or headless, after any prose shown to Budi.",
      "lens": "enhancement"
    }
  ]
}
</script>

<script>
(function () {
  "use strict";

  var SEVERITIES = ["critical", "high", "medium", "low"];
  var SEV_LABEL = { critical: "Critical", high: "High", medium: "Medium", low: "Low" };
  var GRADES = ["excellent", "good", "fair", "poor"];
  var PLACEHOLDER_SUBJECT = "__PLACEHOLDER__";

  var els = {
    banner: document.getElementById("parse-banner"),
    overview: document.getElementById("overview"),
    grade: document.getElementById("grade"),
    verdict: document.getElementById("verdict"),
    summaryText: document.getElementById("summary-text"),
    counts: document.getElementById("counts"),
    themes: document.getElementById("themes"),
    strengths: document.getElementById("strengths"),
    recommendations: document.getElementById("recommendations"),
    experience: document.getElementById("experience"),
    toolbar: document.getElementById("toolbar"),
    root: document.getElementById("findings-root"),
    subject: document.getElementById("m-subject"),
    generated: document.getElementById("m-generated"),
    schema: document.getElementById("m-schema"),
    selCount: document.getElementById("sel-count"),
    btnCopy: document.getElementById("btn-copy"),
    btnSelectAll: document.getElementById("btn-select-all"),
    btnClear: document.getElementById("btn-clear"),
    btnExpandAll: document.getElementById("btn-expand-all"),
    btnCollapseAll: document.getElementById("btn-collapse-all"),
    fallback: document.getElementById("fallback"),
    fallbackText: document.getElementById("fallback-text"),
    toast: document.getElementById("toast")
  };

  var selected = Object.create(null);
  var findings = [];
  var findingsById = Object.create(null);
  var subjectPath = "";
  var standards = null;

  function showBanner(message) {
    els.banner.textContent = message;
    els.banner.classList.add("show");
  }

  function esc(value) {
    var s = value == null ? "" : String(value);
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Normalize an arbitrary parsed object against schema_version 2, supplying
  // defaults so a partial or future island still renders. Unknown fields are
  // ignored, not fatal. Severity counts are always derived from the findings
  // array, never read from the island, so they cannot disagree with it. The
  // synthesis blocks (grade, summary, themes, strengths, recommendations) and
  // the experience block are OPTIONAL: each normalizes to an empty value that
  // renders nothing rather than an empty panel or an error.
  function normalize(raw) {
    var obj = raw && typeof raw === "object" ? raw : {};
    var rawFindings = Array.isArray(obj.findings) ? obj.findings : [];

    var norm = {
      schema_version: typeof obj.schema_version === "number" ? obj.schema_version : 2,
      subject: obj.subject != null ? String(obj.subject) : "(unspecified)",
      generated: obj.generated != null ? String(obj.generated) : "(unspecified)",
      verdict: obj.verdict != null ? String(obj.verdict) : "(no verdict supplied)",
      grade: GRADES.indexOf(String(obj.grade || "").toLowerCase()) >= 0
        ? String(obj.grade).toLowerCase() : "",
      summary: typeof obj.summary === "string" ? obj.summary : "",
      standards: (obj.standards && typeof obj.standards === "object") ? {
        canon: obj.standards.canon != null ? String(obj.standards.canon) : "",
        principles: obj.standards.principles != null ? String(obj.standards.principles) : "",
        scripts: obj.standards.scripts != null ? String(obj.standards.scripts) : ""
      } : null,
      themes: normalizeThemes(obj.themes),
      strengths: normalizeStrengths(obj.strengths),
      recommendations: normalizeRecommendations(obj.recommendations),
      experience: normalizeExperience(obj.experience),
      counts: { critical: 0, high: 0, medium: 0, low: 0 },
      findings: []
    };

    rawFindings.forEach(function (f, i) {
      if (!f || typeof f !== "object") { return; }
      var sev = SEVERITIES.indexOf(f.severity) >= 0 ? f.severity : "low";
      norm.findings.push({
        id: f.id != null ? String(f.id) : "finding-" + (i + 1),
        lens: f.lens != null ? String(f.lens) : "(unknown)",
        severity: sev,
        title: f.title != null ? String(f.title) : "(untitled finding)",
        location: f.location != null ? String(f.location) : "",
        evidence: f.evidence != null ? String(f.evidence) : "",
        recommendation: f.recommendation != null ? String(f.recommendation) : "",
        proposed_smallest: f.proposed_smallest != null ? String(f.proposed_smallest) : "",
        predicted_delta: f.predicted_delta != null ? String(f.predicted_delta) : ""
      });
      norm.counts[sev] += 1;
    });

    return norm;
  }

  function normalizeThemes(raw) {
    if (!Array.isArray(raw)) { return []; }
    var list = [];
    raw.forEach(function (t) {
      if (!t || typeof t !== "object") { return; }
      var ids = [];
      if (Array.isArray(t.finding_ids)) {
        t.finding_ids.forEach(function (id) { if (id != null) { ids.push(String(id)); } });
      }
      var title = t.title != null ? String(t.title) : "";
      if (!title && !ids.length) { return; }
      list.push({
        title: title || "(untitled theme)",
        root_cause: t.root_cause != null ? String(t.root_cause) : "",
        action: t.action != null ? String(t.action) : "",
        finding_ids: ids
      });
    });
    return list;
  }

  function normalizeStrengths(raw) {
    if (!Array.isArray(raw)) { return []; }
    var list = [];
    raw.forEach(function (s) {
      if (typeof s === "string" && s) { list.push(s); }
      else if (s && typeof s === "object" && s.title) {
        list.push(String(s.title) + (s.detail ? " — " + String(s.detail) : ""));
      }
    });
    return list;
  }

  function normalizeRecommendations(raw) {
    if (!Array.isArray(raw)) { return []; }
    var list = [];
    raw.forEach(function (r, i) {
      if (!r || typeof r !== "object") { return; }
      var action = r.action != null ? String(r.action) : "";
      if (!action) { return; }
      var resolves = "";
      if (Array.isArray(r.resolves)) { resolves = r.resolves.map(String).join(", "); }
      else if (typeof r.resolves === "number") { resolves = r.resolves + " findings"; }
      else if (r.resolves != null) { resolves = String(r.resolves); }
      list.push({
        rank: typeof r.rank === "number" ? r.rank : i + 1,
        action: action,
        resolves: resolves
      });
    });
    list.sort(function (a, b) { return a.rank - b.rank; });
    return list;
  }

  // Optional experience block: journeys plus a headless note. Returns null when
  // neither is usable.
  function normalizeExperience(raw) {
    if (!raw || typeof raw !== "object") { return null; }
    var journeys = [];
    if (Array.isArray(raw.journeys)) {
      raw.journeys.forEach(function (j) {
        if (!j || typeof j !== "object") { return; }
        var name = j.name != null ? String(j.name) : "";
        var steps = j.steps != null ? String(j.steps) : "";
        if (!name && !steps) { return; }
        journeys.push({ name: name, steps: steps });
      });
    }
    var headless = raw.headless != null ? String(raw.headless) : "";
    if (!journeys.length && !headless) { return null; }
    return { journeys: journeys, headless: headless };
  }

  function renderOverview(data) {
    els.subject.textContent = data.subject;
    els.generated.textContent = data.generated;
    els.schema.textContent = String(data.schema_version);
    els.verdict.textContent = data.verdict;

    if (data.grade) {
      els.grade.textContent = data.grade;
      els.grade.className = "grade g-" + data.grade;
      els.grade.hidden = false;
    }
    if (data.summary) {
      els.summaryText.textContent = data.summary;
      els.summaryText.hidden = false;
    }

    els.counts.innerHTML = "";
    SEVERITIES.forEach(function (s) {
      var pill = document.createElement("span");
      pill.className = "pill";
      pill.innerHTML =
        '<span class="dot ' + s + '"></span>' +
        '<span class="lbl">' + SEV_LABEL[s] + '</span>' +
        '<span class="n">' + data.counts[s] + "</span>";
      els.counts.appendChild(pill);
    });
    els.overview.hidden = false;
  }

  // Every copied fix prompt opens by anchoring the fixing session to the same
  // standards that produced the findings, so the fix is held to the bar too.
  function standardsPreamble() {
    if (!standards || !standards.canon) { return []; }
    var bar = standards.canon + (standards.principles ? " and " + standards.principles : "");
    var lines = [
      "Hold " + bar + " as the bar for every line you change — a fix that adds ceremony is a new finding, not a fix."
    ];
    if (standards.scripts) {
      lines.push("If the fix adds or changes scripts, follow " + standards.scripts + ".");
    }
    lines.push("");
    return lines;
  }

  function composeThemePrompt(theme, resolved) {
    var lines = standardsPreamble();
    lines.push("Fix the following theme in " + subjectPath + ": " + theme.title);
    lines.push("");
    if (theme.root_cause) { lines.push("Root cause: " + theme.root_cause); }
    if (theme.action) { lines.push("Fix: " + theme.action); }
    if (resolved.length) {
      lines.push("");
      lines.push("Findings to address:");
      resolved.forEach(function (f, i) {
        lines.push((i + 1) + ". " + f.title);
        if (f.location) { lines.push("   Location: " + f.location); }
        if (f.evidence) { lines.push("   Evidence: " + f.evidence); }
        if (f.recommendation) { lines.push("   Recommendation: " + f.recommendation); }
      });
    }
    return lines.join("\n") + "\n";
  }

  function renderThemes(themes) {
    if (!themes.length) { els.themes.hidden = true; return; }
    els.themes.innerHTML = "<h2>Themes</h2>";
    themes.forEach(function (t) {
      var resolved = t.finding_ids
        .map(function (id) { return findingsById[id]; })
        .filter(function (f) { return !!f; });
      var items = resolved.map(function (f) {
        return '<div class="t-finding"><span class="mono">' + esc(f.id) + "</span> " +
          esc(f.title) +
          (f.location ? ' · <span class="mono">' + esc(f.location) + "</span>" : "") +
          "</div>";
      }).join("");

      var node = document.createElement("div");
      node.className = "theme";
      node.innerHTML =
        '<div class="t-head"><span class="t-title">' + esc(t.title) + "</span>" +
        '<button class="small t-fix">Fix This Theme</button></div>' +
        (t.root_cause ? '<div class="t-cause">Root cause: ' + esc(t.root_cause) + "</div>" : "") +
        (t.action ? '<div class="t-action"><b>Fix:</b> ' + esc(t.action) + "</div>" : "") +
        (items ? '<div class="t-findings">' + items + "</div>" : "");
      node.querySelector(".t-fix").addEventListener("click", function () {
        copyText(composeThemePrompt(t, resolved));
      });
      els.themes.appendChild(node);
    });
    els.themes.hidden = false;
  }

  function renderStrengths(list) {
    if (!list.length) { els.strengths.hidden = true; return; }
    els.strengths.innerHTML =
      "<h2>Strengths</h2><ul class=\"strength-list\">" +
      list.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") +
      "</ul>";
    els.strengths.hidden = false;
  }

  function renderRecommendations(recs) {
    if (!recs.length) { els.recommendations.hidden = true; return; }
    var html = "<h2>Recommendations</h2>";
    recs.forEach(function (r) {
      html += '<div class="rec"><span class="rank">#' + esc(String(r.rank)) + "</span>" +
        esc(r.action) +
        (r.resolves ? '<span class="resolves">resolves: ' + esc(r.resolves) + "</span>" : "") +
        "</div>";
    });
    els.recommendations.innerHTML = html;
    els.recommendations.hidden = false;
  }

  function renderExperience(exp) {
    if (!exp) { els.experience.hidden = true; return; }
    var html = "<h2>Experience</h2>";
    if (exp.journeys.length) {
      html += exp.journeys.map(function (j) {
        return '<div class="journey">' +
          '<div class="j-name">' + esc(j.name || "(unnamed journey)") + "</div>" +
          (j.steps ? '<div class="j-steps">' + esc(j.steps) + "</div>" : "") +
          "</div>";
      }).join("");
    }
    if (exp.headless) {
      html += '<dl class="kv" style="margin-top:12px"><dt>Headless</dt><dd>' +
        esc(exp.headless) + "</dd></dl>";
    }
    els.experience.innerHTML = html;
    els.experience.hidden = false;
  }

  function renderNoFindings() {
    els.root.innerHTML =
      '<div class="no-findings">' +
      '<div class="big">No findings</div>' +
      "<div>The scanners returned a clean pass for this subject.</div>" +
      "</div>";
  }

  function findingNode(f) {
    var node = document.createElement("div");
    node.className = "finding sev-" + f.severity;
    node.setAttribute("data-id", f.id);

    var sub =
      esc(f.lens) +
      (f.location ? ' · <span class="mono">' + esc(f.location) + "</span>" : "");

    var rows =
      "<dt>Lens</dt><dd>" + esc(f.lens) + "</dd>" +
      (f.location ? "<dt>Location</dt><dd><code>" + esc(f.location) + "</code></dd>" : "") +
      (f.evidence ? "<dt>Evidence</dt><dd>" + esc(f.evidence) + "</dd>" : "") +
      (f.recommendation ? "<dt>Recommendation</dt><dd>" + esc(f.recommendation) + "</dd>" : "") +
      (f.proposed_smallest ? "<dt>Proposed smallest</dt><dd>" + esc(f.proposed_smallest) + "</dd>" : "") +
      (f.predicted_delta ? "<dt>Predicted delta</dt><dd>" + esc(f.predicted_delta) + "</dd>" : "");

    node.innerHTML =
      '<div class="row">' +
      '<input type="checkbox" class="chk" aria-label="Select finding">' +
      '<div class="head">' +
      '<div class="title">' + esc(f.title) + "</div>" +
      '<div class="sub">' + sub + "</div>" +
      "</div>" +
      '<span class="tag">' + SEV_LABEL[f.severity] + "</span>" +
      '<span class="caret">▸</span>' +
      "</div>" +
      '<div class="body"><dl>' + rows + "</dl></div>";

    var chk = node.querySelector(".chk");
    chk.checked = !!selected[f.id];
    chk.addEventListener("change", function () {
      if (chk.checked) { selected[f.id] = true; } else { delete selected[f.id]; }
      updateSelection();
    });

    var head = node.querySelector(".head");
    var caret = node.querySelector(".caret");
    function toggle() { node.classList.toggle("open"); }
    head.addEventListener("click", toggle);
    caret.addEventListener("click", toggle);

    return node;
  }

  function renderFindings(list) {
    els.root.innerHTML = "";
    if (list.length === 0) {
      renderNoFindings();
      els.toolbar.hidden = true;
      return;
    }
    els.toolbar.hidden = false;

    SEVERITIES.forEach(function (sev) {
      var group = list.filter(function (f) { return f.severity === sev; });
      if (group.length === 0) { return; }
      var wrap = document.createElement("div");
      wrap.className = "group";
      var h = document.createElement("h2");
      h.innerHTML = '<span class="dot ' + sev + '"></span>' + SEV_LABEL[sev] + " (" + group.length + ")";
      wrap.appendChild(h);
      group.forEach(function (f) { wrap.appendChild(findingNode(f)); });
      els.root.appendChild(wrap);
    });
  }

  function updateSelection() {
    var n = Object.keys(selected).length;
    els.selCount.textContent = n + " selected";
    els.btnCopy.disabled = n === 0;
  }

  function composePrompt() {
    var picked = findings.filter(function (f) { return selected[f.id]; });
    if (picked.length === 0) { return ""; }
    var lines = standardsPreamble();
    lines.push("Fix the following issues in " + subjectPath + ":");
    lines.push("");
    picked.forEach(function (f, i) {
      lines.push((i + 1) + ". " + f.title);
      if (f.location) { lines.push("   Location: " + f.location); }
      if (f.evidence) { lines.push("   Evidence: " + f.evidence); }
      if (f.recommendation) { lines.push("   Recommendation: " + f.recommendation); }
      if (f.proposed_smallest) { lines.push("   Proposed smallest: " + f.proposed_smallest); }
      lines.push("");
    });
    return lines.join("\n").replace(/\n+$/, "\n");
  }

  function showToast(text) {
    els.toast.textContent = text;
    els.toast.classList.add("show");
    setTimeout(function () { els.toast.classList.remove("show"); }, 1600);
  }

  function fallbackCopy(text) {
    els.fallbackText.value = text;
    els.fallback.classList.add("show");
    els.fallbackText.focus();
    els.fallbackText.select();
    try {
      var ok = document.execCommand && document.execCommand("copy");
      if (ok) {
        showToast("Copied");
        return;
      }
    } catch (e) { /* fall through to manual */ }
    showToast("Copy the text shown below");
  }

  function copyText(text) {
    if (!text) { return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showToast("Copied"); },
        function () { fallbackCopy(text); }
      );
    } else {
      fallbackCopy(text);
    }
  }

  function doCopy() {
    copyText(composePrompt());
  }

  function wireToolbar() {
    els.btnCopy.addEventListener("click", doCopy);
    els.btnSelectAll.addEventListener("click", function () {
      findings.forEach(function (f) { selected[f.id] = true; });
      document.querySelectorAll(".finding .chk").forEach(function (c) { c.checked = true; });
      updateSelection();
    });
    els.btnClear.addEventListener("click", function () {
      selected = Object.create(null);
      document.querySelectorAll(".finding .chk").forEach(function (c) { c.checked = false; });
      els.fallback.classList.remove("show");
      updateSelection();
    });
    els.btnExpandAll.addEventListener("click", function () {
      document.querySelectorAll(".finding").forEach(function (n) { n.classList.add("open"); });
    });
    els.btnCollapseAll.addEventListener("click", function () {
      document.querySelectorAll(".finding").forEach(function (n) { n.classList.remove("open"); });
    });
  }

  function init() {
    var island = document.getElementById("report-data");
    var parsed;
    try {
      if (!island) { throw new Error("report-data island element not found"); }
      parsed = JSON.parse(island.textContent);
    } catch (err) {
      showBanner(
        "Could not parse the report data island.\n\n" +
        "Error: " + (err && err.message ? err.message : String(err)) + "\n\n" +
        "The findings could not be rendered. The JSON inside the " +
        'report-data island (the application/json script tag) is malformed.'
      );
      return;
    }

    var data = normalize(parsed);

    if (data.subject === PLACEHOLDER_SUBJECT) {
      els.subject.textContent = data.subject;
      showBanner(
        "This is the unfilled report shell.\n\n" +
        "The report-data island still carries the placeholder subject, so " +
        "there are no findings here. Generate a real report with " +
        "scripts/render_report.py."
      );
      return;
    }

    findings = data.findings;
    subjectPath = data.subject;
    standards = data.standards;
    findingsById = Object.create(null);
    findings.forEach(function (f) { findingsById[f.id] = f; });

    renderOverview(data);
    renderThemes(data.themes);
    renderStrengths(data.strengths);
    renderRecommendations(data.recommendations);
    renderExperience(data.experience);
    renderFindings(findings);
    wireToolbar();
    updateSelection();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
